services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyapai
      POSTGRES_PASSWORD: vyapai
      POSTGRES_DB: vyapai
    volumes:
      - vyapai_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://vyapai:vyapai@db:5432/vyapai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app  # live-reload friendly for local dev; remove for prod images
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  vyapai_pgdata:
